# HA Sidebar Shortcuts v1.0.0
# https://github.com/VeZReVouLiS/ha-sidebar-shortcuts
#
# Adds admin shortcuts to the bottom of the Home Assistant sidebar.
# - Visible only to administrators (other users see their normal sidebar).
# - Names follow each user's profile language: Greek (el) or English (everything else).
# - "Apps" hides itself on installs without apps (add-ons), e.g. Container/Core.
# - "Marketplace" hides itself on Home Assistant versions older than 2026.11.
#
# Requires: Custom Sidebar v17+ (elchininet/custom-sidebar), Home Assistant 2026.8+
# Place this file at: /config/www/custom-sidebar-config.yaml

order:
  - new_item: true
    item: developer_tools
    name: '[[[ return String(lang).toLowerCase().startsWith("el") ? "Εργαλεία προγραμματιστή" : "Developer Tools" ]]]'
    icon: mdi:hammer
    href: /developer-tools/yaml
    hide: '[[[ return !user_is_admin ]]]'
    bottom: true
    order: 0
  - new_item: true
    item: devices_and_services
    name: '[[[ return String(lang).toLowerCase().startsWith("el") ? "Συσκευές & υπηρεσίες" : "Devices & Services" ]]]'
    icon: mdi:devices
    href: /config/integrations/dashboard
    hide: '[[[ return !user_is_admin ]]]'
    bottom: true
    order: 1
  - new_item: true
    item: automations_and_scenes
    name: '[[[ return String(lang).toLowerCase().startsWith("el") ? "Αυτοματισμοί & σκηνές" : "Automations & Scenes" ]]]'
    icon: mdi:robot
    href: /config/automation/dashboard
    hide: '[[[ return !user_is_admin ]]]'
    bottom: true
    order: 2
  - new_item: true
    item: apps
    name: '[[[ return String(lang).toLowerCase().startsWith("el") ? "Εφαρμογές" : "Apps" ]]]'
    icon: mdi:apps
    href: /config/apps/installed
    hide: '[[[ return !user_is_admin || !hass.config.components.includes("hassio") ]]]'
    bottom: true
    order: 3
  - new_item: true
    item: marketplace
    name: Marketplace
    icon: mdi:store
    href: /marketplace
    hide: '[[[ return !user_is_admin || !hass.config.components.includes("marketplace") ]]]'
    bottom: true
    divider: true
    order: 4
